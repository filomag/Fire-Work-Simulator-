<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireworks & Particle FX Designer</title>
    <!-- Tailwind CSS CDN for styling control UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styling for canvas overlay and dark UI */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(18, 20, 32, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Custom scrollbar for control panel */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Neon Glow Utility Effects */
        .glow-cyan {
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
        }
        .glow-pink {
            box-shadow: 0 0 12px rgba(236, 72, 153, 0.4);
        }
        .glow-amber {
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        /* Input styling */
        input[type=range] {
            accent-color: #06b6d4;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between h-screen relative">

    <!-- Canvas Container -->
    <div id="canvas-container">
        <canvas id="fireworksCanvas"></canvas>
    </div>

    <!-- Top Navigation / Title Overlay -->
    <header class="relative z-10 p-4 flex justify-between items-center pointer-events-none">
        <div class="pointer-events-auto flex items-center space-x-3">
            <div class="p-2.5 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 text-white shadow-lg glow-cyan">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-pink-400 to-amber-300">
                    IGNIS FX
                </h1>
                <p class="text-xs text-slate-400">Fireworks & Particle Sound Lab</p>
            </div>
        </div>

        <!-- Quick Status & Top Action Bar -->
        <div class="pointer-events-auto flex items-center space-x-2">
            <button id="audioToggleBtn" class="glass-panel px-3 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 border border-slate-700 hover:border-cyan-500 transition-all">
                <span id="audioIcon">🔇</span>
                <span id="audioStatusText">Audio Off</span>
            </button>
            <button id="showToggleBtn" class="glass-panel px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider text-pink-400 border border-pink-500/30 hover:bg-pink-500/20 transition-all flex items-center space-x-2 glow-pink">
                <span class="inline-block w-2 h-2 rounded-full bg-pink-500 animate-ping"></span>
                <span id="showBtnText">Start Music Show</span>
            </button>
            <button id="toggleControlsBtn" class="glass-panel p-2 rounded-lg text-slate-300 hover:text-white border border-slate-700 transition-all md:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 010 4m-6 8a2 2 0 100-4m0 4a2 2 0 010-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 010-4m0 4v2m0-6V4" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Center Prompt overlay when idle -->
    <div id="instructionHint" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none transition-opacity duration-1000 z-10">
        <p class="text-slate-300 text-sm font-medium bg-slate-900/60 px-4 py-2 rounded-full border border-slate-700/50 backdrop-blur-md">
            ✨ Click or tap anywhere to launch shell
        </p>
    </div>

    <!-- Bottom / Sidebar Control Panel -->
    <div id="controlPanel" class="relative z-10 m-4 md:w-96 glass-panel rounded-2xl p-5 border border-slate-800 transition-all duration-300 custom-scroll max-h-[80vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center space-x-2">
                <span>Designer Rack</span>
            </h2>
            <button id="clearBtn" class="text-xs text-slate-400 hover:text-amber-400 transition-colors">Clear Screen</button>
        </div>

        <!-- Shell Selection Grid -->
        <div class="space-y-3 mb-5">
            <label class="text-xs text-slate-400 font-semibold block">Shell Type</label>
            <div class="grid grid-cols-2 gap-2" id="shellTypeGrid">
                <button data-type="peony" class="shell-btn px-3 py-2 text-xs rounded-xl border border-cyan-500/50 bg-cyan-500/10 text-cyan-300 font-medium hover:bg-cyan-500/20 transition-all text-left">Peony Bloom</button>
                <button data-type="ring" class="shell-btn px-3 py-2 text-xs rounded-xl border border-slate-700 bg-slate-800/40 text-slate-400 font-medium hover:bg-slate-800 transition-all text-left">Saturn Ring</button>
                <button data-type="willow" class="shell-btn px-3 py-2 text-xs rounded-xl border border-slate-700 bg-slate-800/40 text-slate-400 font-medium hover:bg-slate-800 transition-all text-left">Gold Willow</button>
                <button data-type="strobe" class="shell-btn px-3 py-2 text-xs rounded-xl border border-slate-700 bg-slate-800/40 text-slate-400 font-medium hover:bg-slate-800 transition-all text-left">Strobe Glitter</button>
                <button data-type="multiburst" class="shell-btn px-3 py-2 text-xs rounded-xl border border-slate-700 bg-slate-800/40 text-slate-400 font-medium hover:bg-slate-800 transition-all text-left">Multi-Stage Cluster</button>
                <button data-type="crackle" class="shell-btn px-3 py-2 text-xs rounded-xl border border-slate-700 bg-slate-800/40 text-slate-400 font-medium hover:bg-slate-800 transition-all text-left">Dragon Crackle</button>
            </div>
        </div>

        <!-- Palette Selection Grid -->
        <div class="space-y-3 mb-5">
            <label class="text-xs text-slate-400 font-semibold block">Color Palette</label>
            <div class="grid grid-cols-3 gap-2" id="paletteGrid">
                <button data-palette="gold" class="palette-btn p-2 rounded-xl border border-amber-500/50 bg-amber-500/10 text-amber-300 text-xs font-medium hover:bg-amber-500/20 transition-all flex items-center space-x-1">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>
                    <span>Gold</span>
                </button>
                <button data-palette="cyber" class="palette-btn p-2 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-400 text-xs font-medium hover:bg-slate-800 transition-all flex items-center space-x-1">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 inline-block"></span>
                    <span>Cyber</span>
                </button>
                <button data-palette="rainbow" class="palette-btn p-2 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-400 text-xs font-medium hover:bg-slate-800 transition-all flex items-center space-x-1">
                    <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-red-500 via-green-500 to-blue-500 inline-block"></span>
                    <span>Rainbow</span>
                </button>
                <button data-palette="emerald" class="palette-btn p-2 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-400 text-xs font-medium hover:bg-slate-800 transition-all flex items-center space-x-1">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block"></span>
                    <span>Emerald</span>
                </button>
                <button data-palette="pastel" class="palette-btn p-2 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-400 text-xs font-medium hover:bg-slate-800 transition-all flex items-center space-x-1">
                    <span class="w-2.5 h-2.5 rounded-full bg-pink-300 inline-block"></span>
                    <span>Pastel</span>
                </button>
                <button data-palette="fire" class="palette-btn p-2 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-400 text-xs font-medium hover:bg-slate-800 transition-all flex items-center space-x-1">
                    <span class="w-2.5 h-2.5 rounded-full bg-orange-500 inline-block"></span>
                    <span>Fire</span>
                </button>
            </div>
        </div>

        <!-- Sliders -->
        <div class="space-y-4">
            <!-- Particle Count -->
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-slate-400">Particle Density</span>
                    <span id="particleVal" class="text-cyan-400 font-mono">180</span>
                </div>
                <input type="range" id="particleSlider" min="50" max="400" value="180" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- Explosion Force -->
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-slate-400">Burst Power</span>
                    <span id="forceVal" class="text-cyan-400 font-mono">1.0</span>
                </div>
                <input type="range" id="forceSlider" min="0.5" max="2.5" step="0.1" value="1.0" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- Gravity Slider -->
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-slate-400">Gravity Scale</span>
                    <span id="gravityVal" class="text-cyan-400 font-mono">1.0</span>
                </div>
                <input type="range" id="gravitySlider" min="0.1" max="2.0" step="0.1" value="1.0" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- Wind Drift Slider -->
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-slate-400">Wind Velocity</span>
                    <span id="windVal" class="text-cyan-400 font-mono">0.0</span>
                </div>
                <input type="range" id="windSlider" min="-1.5" max="1.5" step="0.1" value="0.0" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>

        <!-- Manual Launch Action -->
        <button id="launchBtn" class="mt-6 w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-sm tracking-wide shadow-lg glow-cyan transition-all flex justify-center items-center space-x-2">
            <span>🚀</span>
            <span>Launch Single Rocket</span>
        </button>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        /**
         * IGNIS FX - Interactive Fireworks & Particle Engine
         * Implements canvas particle physics and synthesized Web Audio sound effects
         */

        // Global Configuration & State
        const state = {
            shellType: 'peony',
            paletteName: 'gold',
            particleCount: 180,
            burstPower: 1.0,
            gravityScale: 1.0,
            windStrength: 0.0,
            soundEnabled: false,
            musicalShowActive: false,
            showTimer: null,
            beatStep: 0,
            audioCtx: null
        };

        // Palette Color Definitions (HSL formatted for dynamic glitter shifts)
        const PALETTES = {
            gold: [
                { h: 45, s: 100, l: 60 },  // Gold
                { h: 35, s: 100, l: 50 },  // Deep Amber
                { h: 55, s: 90, l: 75 }   // Pale Gold
            ],
            cyber: [
                { h: 185, s: 100, l: 50 }, // Neon Cyan
                { h: 320, s: 100, l: 60 }, // Hot Pink
                { h: 270, s: 100, l: 65 }  // Electric Violet
            ],
            rainbow: [
                { h: 0, s: 100, l: 60 },   // Red
                { h: 45, s: 100, l: 50 },  // Yellow
                { h: 120, s: 100, l: 50 }, // Green
                { h: 200, s: 100, l: 60 }, // Blue
                { h: 280, s: 100, l: 60 }  // Purple
            ],
            emerald: [
                { h: 150, s: 100, l: 45 }, // Emerald
                { h: 170, s: 100, l: 50 }, // Mint
                { h: 210, s: 100, l: 60 }  // Sapphire Blue
            ],
            pastel: [
                { h: 330, s: 80, l: 75 },  // Pastel Pink
                { h: 190, s: 80, l: 75 },  // Pastel Cyan
                { h: 270, s: 80, l: 80 }   // Soft Lavender
            ],
            fire: [
                { h: 15, s: 100, l: 55 },  // Fiery Orange
                { h: 0, s: 100, l: 50 },   // Crimson
                { h: 50, s: 100, l: 60 }   // Intense Yellow
            ]
        };

        // Canvas Setup
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Collections for active physics entities
        const rockets = [];
        const particles = [];

        // Utility: Get Random Color from Palette
        function getRandomColor(paletteKey) {
            const colors = PALETTES[paletteKey] || PALETTES.gold;
            const base = colors[Math.floor(Math.random() * colors.length)];
            return { ...base };
        }

        // --- WEB AUDIO SYNTHESIZER ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Synthesize launch whistle/whoosh
            playLaunchSound() {
                if (!state.soundEnabled || !this.ctx) return;
                const now = this.ctx.currentTime;

                // Oscillator for whistle pitch sweep
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.4);

                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.15, now + 0.2);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.45);
            }

            // Synthesize low punchy explosion boom
            playExplosionSound(powerScale = 1.0) {
                if (!state.soundEnabled || !this.ctx) return;
                const now = this.ctx.currentTime;

                // 1. Low sine boom tone
                const osc = this.ctx.createOscillator();
                const oscGain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160 * powerScale, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.5);

                oscGain.gain.setValueAtTime(0.4, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

                osc.connect(oscGain);
                oscGain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.6);

                // 2. Filtered noise crackle
                const bufferSize = this.ctx.sampleRate * 0.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.linearRampToValueAtTime(100, now + 0.4);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.3, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);

                noise.start(now);
            }

            // Synthesize small crackle / pop
            playCrackleSound() {
                if (!state.soundEnabled || !this.ctx) return;
                if (Math.random() > 0.3) return; // Trigger stochastically for natural feel

                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.05;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.setValueAtTime(2000, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
            }

            // Play background musical synthesis chord for Show Mode
            playMusicNote(freq, type = 'sine', duration = 0.3) {
                if (!state.soundEnabled || !this.ctx) return;
                const now = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + duration);
            }
        }

        const sound = new SoundEngine();

        // --- ROCKET CLASS ---
        class Rocket {
            constructor(startX, startY, targetX, targetY, shellType, paletteName) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.shellType = shellType;
                this.paletteName = paletteName;

                const dx = targetX - startX;
                const dy = targetY - startY;
                const distance = Math.hypot(dx, dy);

                this.speed = 12 + Math.random() * 4;
                this.vx = (dx / distance) * this.speed;
                this.vy = (dy / distance) * this.speed;

                this.trail = [];
                this.dead = false;

                sound.playLaunchSound();
            }

            update() {
                this.trail.push({ x: this.x, y: this.y, alpha: 1.0 });
                if (this.trail.length > 8) this.trail.shift();

                // Move toward target
                this.x += this.vx;
                this.y += this.vy;

                // Add slight gravity upward deceleration
                this.vy += 0.05 * state.gravityScale;

                // Check distance to target destination
                const distToTarget = Math.hypot(this.targetX - this.x, this.targetY - this.y);
                if (distToTarget < 15 || this.vy >= -0.5) {
                    this.dead = true;
                    explodeShell(this.x, this.y, this.shellType, this.paletteName);
                }
            }

            draw() {
                // Draw rocket trail
                ctx.beginPath();
                for (let i = 0; i < this.trail.length; i++) {
                    const pt = this.trail[i];
                    ctx.lineTo(pt.x, pt.y);
                }
                ctx.strokeStyle = 'rgba(255, 200, 100, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Rocket tip spark
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- PARTICLE CLASS ---
        class Particle {
            constructor(x, y, vx, vy, color, options = {}) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color; // {h, s, l}

                this.alpha = 1.0;
                this.decay = options.decay || (0.012 + Math.random() * 0.01);
                this.friction = options.friction || 0.96;
                this.gravity = options.gravity !== undefined ? options.gravity : 0.12;

                this.strobe = options.strobe || false;
                this.willow = options.willow || false;
                this.crackle = options.crackle || false;
                this.secondary = options.secondary || false;

                this.history = [];
                this.maxHistory = options.willow ? 12 : 5;
            }

            update() {
                // Record past positions for trail effect
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                }

                // Physics simulation
                this.vx *= this.friction;
                this.vy *= this.friction;

                this.vx += state.windStrength * 0.05;
                this.vy += this.gravity * state.gravityScale;

                this.x += this.vx;
                this.y += this.vy;

                // Alpha decay
                this.alpha -= this.decay;

                // Crackle sound trigger
                if (this.crackle && Math.random() < 0.03 && this.alpha > 0.2) {
                    sound.playCrackleSound();
                }

                // Secondary cluster burst
                if (this.secondary && this.alpha < 0.4 && !this.hasBurst) {
                    this.hasBurst = true;
                    createMiniBurst(this.x, this.y, this.color);
                }
            }

            draw() {
                ctx.save();

                // Draw motion trail line
                if (this.history.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.history[0].x, this.history[0].y);
                    for (let p of this.history) {
                        ctx.lineTo(p.x, p.y);
                    }
                    ctx.strokeStyle = `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, ${this.alpha * 0.5})`;
                    ctx.lineWidth = this.willow ? 1.8 : 1.2;
                    ctx.stroke();
                }

                // Particle Head Glow / Strobe Effect
                let brightness = this.color.l;
                let drawAlpha = this.alpha;

                if (this.strobe && Math.random() > 0.4) {
                    brightness = 100; // Flash white
                    drawAlpha = Math.min(1.0, drawAlpha * 1.5);
                }

                ctx.fillStyle = `hsla(${this.color.h}, ${this.color.s}%, ${brightness}%, ${drawAlpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.willow ? 1.5 : 2.0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // --- SHELL EXPLOSION BUILDERS ---
        function explodeShell(x, y, shellType, paletteName) {
            const count = state.particleCount;
            const power = state.burstPower;

            sound.playExplosionSound(power);

            switch (shellType) {
                case 'ring':
                    createRingShell(x, y, paletteName, count, power);
                    break;
                case 'willow':
                    createWillowShell(x, y, paletteName, count, power);
                    break;
                case 'strobe':
                    createStrobeShell(x, y, paletteName, count, power);
                    break;
                case 'multiburst':
                    createMultiStageShell(x, y, paletteName, count, power);
                    break;
                case 'crackle':
                    createCrackleShell(x, y, paletteName, count, power);
                    break;
                case 'peony':
                default:
                    createPeonyShell(x, y, paletteName, count, power);
                    break;
            }
        }

        // Standard Sphere Peony
        function createPeonyShell(x, y, paletteName, count, power) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 6 + 2) * power;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                const color = getRandomColor(paletteName);
                particles.push(new Particle(x, y, vx, vy, color, {
                    decay: 0.015 + Math.random() * 0.01,
                    friction: 0.95
                }));
            }
        }

        // Circular Ring / Saturn Effect
        function createRingShell(x, y, paletteName, count, power) {
            const ringRadius = 5.5 * power;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const speed = ringRadius + (Math.random() - 0.5) * 0.5;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                const color = getRandomColor(paletteName);
                particles.push(new Particle(x, y, vx, vy, color, {
                    decay: 0.014,
                    friction: 0.96
                }));
            }
        }

        // Drooping Golden Willow
        function createWillowShell(x, y, paletteName, count, power) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 5 + 1) * power;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                const color = { h: 42, s: 100, l: 65 }; // Deep Gold
                particles.push(new Particle(x, y, vx, vy, color, {
                    decay: 0.007 + Math.random() * 0.004, // Very slow decay
                    friction: 0.97,
                    gravity: 0.18,
                    willow: true
                }));
            }
        }

        // Glitter Strobe Flash
        function createStrobeShell(x, y, paletteName, count, power) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 7 + 1.5) * power;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                const color = getRandomColor(paletteName);
                particles.push(new Particle(x, y, vx, vy, color, {
                    decay: 0.012 + Math.random() * 0.008,
                    friction: 0.95,
                    strobe: true
                }));
            }
        }

        // Multi-Stage Sub-Explosions
        function createMultiStageShell(x, y, paletteName, count, power) {
            const primaryCount = Math.floor(count * 0.3);
            for (let i = 0; i < primaryCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 8 + 3) * power;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                const color = getRandomColor(paletteName);
                particles.push(new Particle(x, y, vx, vy, color, {
                    decay: 0.02,
                    friction: 0.94,
                    secondary: true
                }));
            }
        }

        function createMiniBurst(x, y, parentColor) {
            sound.playExplosionSound(0.3);
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                particles.push(new Particle(x, y, vx, vy, parentColor, {
                    decay: 0.03,
                    friction: 0.92
                }));
            }
        }

        // Dragon Crackle Streamers
        function createCrackleShell(x, y, paletteName, count, power) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 6 + 2) * power;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                const color = getRandomColor(paletteName);
                particles.push(new Particle(x, y, vx, vy, color, {
                    decay: 0.018 + Math.random() * 0.01,
                    friction: 0.95,
                    crackle: true
                }));
            }
        }

        // --- RENDER LOOP ---
        function animate() {
            // Smooth trail fade canvas fill
            ctx.fillStyle = 'rgba(5, 5, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Light blend mode for vivid particle overlap glow
            ctx.globalCompositeOperation = 'lighter';

            // Update & Render Rockets
            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];
                r.update();
                r.draw();
                if (r.dead) rockets.splice(i, 1);
            }

            // Update & Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }

        // --- MUSICAL LIGHT SHOW SCHEDULER ---
        const SHOW_NOTES = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23]; // C5, E5, G5, C6, A5, F5
        function runMusicalShowStep() {
            if (!state.musicalShowActive) return;

            const step = state.beatStep;
            const noteFreq = SHOW_NOTES[step % SHOW_NOTES.length];

            // Synth Beat sound
            sound.playMusicNote(noteFreq, 'triangle', 0.4);

            // Synchronized Launcher
            const targetX = width * (0.15 + Math.random() * 0.7);
            const targetY = height * (0.15 + Math.random() * 0.35);
            const startX = targetX + (Math.random() - 0.5) * 100;

            const shells = ['peony', 'ring', 'willow', 'strobe', 'multiburst', 'crackle'];
            const randomShell = shells[Math.floor(Math.random() * shells.length)];

            rockets.push(new Rocket(startX, height, targetX, targetY, randomShell, state.paletteName));

            state.beatStep++;
            state.showTimer = setTimeout(runMusicalShowStep, 450); // ~133 BPM
        }

        // --- INTERACTION & EVENT LISTENERS ---

        // User Canvas Launch Trigger
        function launchRocketTo(x, y) {
            sound.init();
            const startX = width / 2 + (Math.random() - 0.5) * 200;
            rockets.push(new Rocket(startX, height, x, y, state.shellType, state.paletteName));

            // Hide hint prompt after interaction
            const hint = document.getElementById('instructionHint');
            if (hint) hint.style.opacity = '0';
        }

        canvas.addEventListener('pointerdown', (e) => {
            // Prevent interaction if clicking controls
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            launchRocketTo(x, y);
        });

        // UI Inputs Bindings
        document.getElementById('launchBtn').addEventListener('click', () => {
            const targetX = width * (0.2 + Math.random() * 0.6);
            const targetY = height * (0.2 + Math.random() * 0.3);
            launchRocketTo(targetX, targetY);
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            rockets.length = 0;
            particles.length = 0;
        });

        // Shell Selection Buttons
        document.querySelectorAll('.shell-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.shell-btn').forEach(b => {
                    b.className = 'shell-btn px-3 py-2 text-xs rounded-xl border border-slate-700 bg-slate-800/40 text-slate-400 font-medium hover:bg-slate-800 transition-all text-left';
                });
                const target = e.currentTarget;
                target.className = 'shell-btn px-3 py-2 text-xs rounded-xl border border-cyan-500/50 bg-cyan-500/10 text-cyan-300 font-medium hover:bg-cyan-500/20 transition-all text-left';
                state.shellType = target.dataset.type;
            });
        });

        // Palette Selection Buttons
        document.querySelectorAll('.palette-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.palette-btn').forEach(b => {
                    b.classList.remove('border-amber-500/50', 'bg-amber-500/10', 'text-amber-300');
                    b.classList.add('border-slate-700', 'bg-slate-800/40', 'text-slate-400');
                });
                const target = e.currentTarget;
                target.classList.remove('border-slate-700', 'bg-slate-800/40', 'text-slate-400');
                target.classList.add('border-amber-500/50', 'bg-amber-500/10', 'text-amber-300');
                state.paletteName = target.dataset.palette;
            });
        });

        // Sliders
        const particleSlider = document.getElementById('particleSlider');
        particleSlider.addEventListener('input', (e) => {
            state.particleCount = parseInt(e.target.value);
            document.getElementById('particleVal').innerText = e.target.value;
        });

        const forceSlider = document.getElementById('forceSlider');
        forceSlider.addEventListener('input', (e) => {
            state.burstPower = parseFloat(e.target.value);
            document.getElementById('forceVal').innerText = parseFloat(e.target.value).toFixed(1);
        });

        const gravitySlider = document.getElementById('gravitySlider');
        gravitySlider.addEventListener('input', (e) => {
            state.gravityScale = parseFloat(e.target.value);
            document.getElementById('gravityVal').innerText = parseFloat(e.target.value).toFixed(1);
        });

        const windSlider = document.getElementById('windSlider');
        windSlider.addEventListener('input', (e) => {
            state.windStrength = parseFloat(e.target.value);
            document.getElementById('windVal').innerText = parseFloat(e.target.value).toFixed(1);
        });

        // Audio Toggle Button
        const audioBtn = document.getElementById('audioToggleBtn');
        audioBtn.addEventListener('click', () => {
            sound.init();
            state.soundEnabled = !state.soundEnabled;
            document.getElementById('audioIcon').innerText = state.soundEnabled ? '🔊' : '🔇';
            document.getElementById('audioStatusText').innerText = state.soundEnabled ? 'Audio On' : 'Audio Off';
            audioBtn.classList.toggle('border-cyan-500', state.soundEnabled);
        });

        // Musical Show Toggle
        const showBtn = document.getElementById('showToggleBtn');
        showBtn.addEventListener('click', () => {
            sound.init();
            state.musicalShowActive = !state.musicalShowActive;

            if (state.musicalShowActive) {
                state.soundEnabled = true;
                document.getElementById('audioIcon').innerText = '🔊';
                document.getElementById('audioStatusText').innerText = 'Audio On';
                audioBtn.classList.add('border-cyan-500');

                document.getElementById('showBtnText').innerText = 'Stop Music Show';
                showBtn.classList.remove('text-pink-400', 'border-pink-500/30');
                showBtn.classList.add('text-amber-400', 'border-amber-500');
                runMusicalShowStep();
            } else {
                document.getElementById('showBtnText').innerText = 'Start Music Show';
                showBtn.classList.remove('text-amber-400', 'border-amber-500');
                showBtn.classList.add('text-pink-400', 'border-pink-500/30');
                clearTimeout(state.showTimer);
            }
        });

        // Mobile Responsive Menu Toggle
        const toggleControlsBtn = document.getElementById('toggleControlsBtn');
        const controlPanel = document.getElementById('controlPanel');
        toggleControlsBtn.addEventListener('click', () => {
            controlPanel.classList.toggle('hidden');
        });

        // Start Canvas Render Loop
        window.onload = () => {
            animate();
        };
    </script>
</body>
</html>
